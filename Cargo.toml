[package]
name = "image-turbo"
version = "2.4.0"
edition = "2021"
license = "MIT"
authors = ["Aissam Irhir <aissamirhir@gmail.com>"]
description = "High-performance image processing for Bun and Node.js"

[lib]
crate-type = ["cdylib"]
path = "rust/src/lib.rs"

[dependencies]
# napi-rs bindings (v3 - with streaming, better async, lifetime support)
napi = { version = "3.8.2", features = ["async", "napi8"] }
napi-derive = "3.5.1"

# Image processing
image = { version = "0.25", default-features = false, features = ["png", "gif", "webp", "bmp", "ico", "tiff", "jpeg"] }
fast_image_resize = { version = "5", features = ["image", "rayon"] }

# TurboJPEG - libjpeg-turbo bindings (THE fastest JPEG codec with SIMD)
# Uses SSE2/AVX2/NEON for 2-6x faster encode/decode than pure Rust
turbojpeg = { version = "1.3", features = ["image"], optional = true }

# MozJPEG - for shrink-on-load support (decode at reduced resolution)
# Fallback for shrink-on-load since turbojpeg doesn't support it
mozjpeg = { version = "0.10", optional = true }

# Multi-threading
rayon = "1.10"

# WebP support
webp = { version = "0.3", optional = true }

# Low-level libwebp bindings for shrink-on-load optimization
# Enables use_scaling for decoding directly to target resolution
libwebp-sys2 = { version = "0.1", optional = true }

# Async runtime
tokio = { version = "1", features = ["rt", "sync", "time"] }

# Error handling
thiserror = "2"

# For blurhash generation
blurhash = "0.2"

# For thumbhash generation (better placeholders with alpha support)
thumbhash = "0.1"

# For perceptual hashing (pHash, dHash, aHash) - image similarity detection
image_hasher = "2.0"

# For smart cropping (content-aware, saliency detection)
smartcrop2 = "0.4"

# For dominant color extraction (palette generation)
dominant_color = "0.4"

# For EXIF/metadata writing (WebP, JPEG, PNG)
img-parts = "0.3"

# HEIC/HEIF support via libheif
# Uses embedded-libheif to statically link libheif (no system dependency needed)
# This avoids dylib version mismatches (e.g. libheif.1.dylib vs libheif.19.dylib)
libheif-rs = { version = "2.5", default-features = false, features = ["v1_17", "embedded-libheif"], optional = true }

[features]
default = ["native-codecs"]

# Native C codecs: libjpeg-turbo (SIMD) + libwebp.
# Fastest path, but requires nasm/cmake at build time and cannot target WebAssembly.
# Disable with --no-default-features to get a pure-Rust, C-free build (see docs/guide/wasm.md).
native-codecs = ["dep:turbojpeg", "dep:mozjpeg", "dep:webp", "dep:libwebp-sys2"]

# HEIC/HEIF decoding via libheif. Native-only (C library), macOS ARM64 in CI.
heic = ["dep:libheif-rs"]

[build-dependencies]
napi-build = "2.3.1"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = "symbols"
